<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma cave à bières</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#111;color:#e8e0d0;min-height:100vh;padding:32px 16px}
  h1{text-align:center;font-size:2rem;font-weight:800;color:#f5a623;margin-bottom:6px}
  .subtitle{text-align:center;font-size:.85rem;color:#888;margin-bottom:36px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;max-width:1100px;margin:0 auto}
  .card{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
  .card-name{font-size:1.15rem;font-weight:700;color:#f5a623}
  .card-style{font-size:.82rem;color:#aaa;font-style:italic}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px}
  .badge{background:#2a2a2a;border:1px solid #444;border-radius:20px;padding:2px 10px;font-size:.78rem;color:#ccc}
  .desc{font-size:.83rem;color:#999;line-height:1.5}
  .empty{text-align:center;color:#666;padding:60px 0;font-size:1rem}
</style>
</head>
<body>
<h1>Ma cave à bières</h1>
<p class="subtitle">Mise à jour le 22 février 2026</p>
<div class="grid">
    <div class="card">
      <div class="card-name">Test</div>
      
      <div class="card-meta">
        <span class="badge">ABV 5.5 %</span>
        <span class="badge">33 cl : 0</span>
        <span class="badge">75 cl : 0</span>
      </div>
      
    </div>
    <div class="card">
      <div class="card-name">Black Hops</div>
      
      <div class="card-meta">
        <span class="badge">ABV 6.0 %</span>
        <span class="badge">33 cl : 5</span>
        <span class="badge">75 cl : 7</span>
      </div>
      
    </div>
    <div class="card">
      <div class="card-name">StoutStout</div>
      
      <div class="card-meta">
        <span class="badge">ABV 4.7 %</span>
        <span class="badge">33 cl : 6</span>
        <span class="badge">75 cl : 7</span>
      </div>
      
    </div></div>
</body>
</html>
